version: 2

updates:
  # Actions drift silently: a workflow keeps running on a pinned major until the
  # runner deprecates its Node runtime, and the first sign is a warning nobody
  # reads on a green run.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ""
    groups:
      actions:
        patterns: ["*"]

  # Two runtime dependencies and a small dev set, so a monthly batch is enough
  # noise. No `versioning-strategy`: the bounds in pyproject.toml — the `<3` cap
  # on bibtexparser among them — are authored deliberately, and a proposal that
  # moves one is a decision for the reviewer of the pull request, not something
  # to encode here.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ""
    groups:
      # One group for everything: `dependency-type: development` does not match
      # here, because Dependabot's uv parser leaves entries from
      # `[project.optional-dependencies]` untyped.
      dependencies:
        patterns: ["*"]
