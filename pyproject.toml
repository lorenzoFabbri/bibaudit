[project]
name = "bibaudit"
version = "0.1.0"
description = "Deterministic, field-level verification of bibliographies against Crossref, DataCite and PubMed"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lorenzo Fabbri" }]
keywords = [
    "bibliography",
    "bibtex",
    "citation",
    "crossref",
    "pubmed",
    "quarto",
    "reproducibility",
    "zotero",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Kept in step with the matrix in .github/workflows/ci.yml; a version
    # claimed here and untested there is a claim nothing backs.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

# Kept deliberately small. Every dependency is one more thing that must be
# present in a CI container before a citation can be checked.
dependencies = [
    # v2 parses one-line and multi-entry-per-line files correctly. The upper
    # bound is not ceremony: naming a pre-release makes resolvers accept every
    # later pre-release too, and `bibtex.py` calls `parse_file`, which v2 does
    # not list in its public exports. A lockfile constrains this repo and CI,
    # not somebody installing the published package.
    "bibtexparser>=2.0.0b7,<3",

    "rapidfuzz>=3.0",        # fuzzy matching that stays fast on thousands of entries
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

# Documentation only, and a dependency-group rather than an extra so that it
# stays out of the test environment. `.github/workflows/ci.yml` installs with
# `uv sync --all-extras` on three Python versions; that unions every entry in
# `[project.optional-dependencies]`, so a `docs` *extra* would have been
# installed by the very command this separation exists to keep it out of.
# `--all-extras` does not pull non-default dependency-groups, so this does.
# The docs build asks for it by name: `uv run --group docs mkdocs build`.
[dependency-groups]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/lorenzoFabbri/bibaudit"
Documentation = "https://lorenzofabbri.github.io/bibaudit/"
Issues = "https://github.com/lorenzoFabbri/bibaudit/issues"

[project.scripts]
bibaudit = "bibaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibaudit"]

[tool.coverage.report]
# Branch coverage sits at 93.3%. The floor is a ratchet against a change that
# quietly deletes coverage, not a target to chase: set close enough to bite and
# far enough that an ordinary refactor moving lines around does not fail the
# build for a reason nobody can act on. A number reported to a log nobody reads
# enforces nothing, and a floor that cries wolf gets raised until it does too.
fail_under = 92
show_missing = true

[tool.coverage.run]
branch = true
source = ["src/bibaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not network"` is the half that makes the marker below mean anything.
# Declaring the marker and documenting it as "deselected by default" only
# *described* a deselection nothing performed: a plain `uv run pytest` ran the
# networked tests too, so the offline guarantee CLAUDE.md makes would have
# started failing in a sealed CI container the moment the first such test was
# written. Overriding it is `uv run pytest -m network` (or `-m ""` for both),
# because a later -m wins.
addopts = "-q --strict-markers -m 'not network'"
markers = [
    # Anything touching the network is opt-in: the default test run must pass
    # on a laptop with no connection, or people stop running it.
    "network: requires internet access (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501", # long lines are allowed in docstrings that quote real registry values
]

[tool.ruff.lint.per-file-ignores]
# RUF001 flags "ambiguous" Unicode — a curly apostrophe that could be a grave
# accent, an en dash that could be a hyphen. In a project whose whole purpose is
# to notice that a stored title differs from the registry's by exactly one such
# glyph, those characters are the test data: `clean("Parkinson’s Disease")` has
# to be written with U+2019 or it asserts nothing. The rule stays on everywhere
# else, where an ambiguous character in source really is a typo.
"tests/test_normalize.py" = ["RUF001"]
"tests/test_compare.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/bibaudit"]

[[tool.mypy.overrides]]
module = "bibtexparser.*"
ignore_missing_imports = true
