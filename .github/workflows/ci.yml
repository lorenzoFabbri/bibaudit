name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN scope is a repository-wide web setting that can be
# widened without touching this file. Stating it here means the permissions a
# run holds are reviewable in the same diff that grants them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # Pinned so every job installs the same uv a laptop runs, rather
          # than whatever is newest that morning. It does not avoid the
          # version-manifest fetch setup-uv makes on every job regardless, and
          # that fetch has a short timeout that has aborted a job.
          version: "0.11.7"
          # `.python-version` pins 3.11, so without this every job in the
          # matrix resolves the same interpreter and the job names lie. This
          # input sets UV_PYTHON, which takes precedence over that file.
          python-version: ${{ matrix.python-version }}
      - name: Install
        # --locked fails the step when uv.lock has drifted from pyproject.toml
        # rather than silently re-resolving, so the lockfile is enforced rather
        # than merely committed.
        run: uv sync --all-extras --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      # Deliberately excludes the network-marked tests: CI must prove the logic,
      # not the availability of Crossref.
      #
      # `--cov` carries no argument: a package name here reaches coverage as
      # `source=`, which overrides `[tool.coverage.run]` in pyproject.toml. Left
      # bare, what is measured is decided in the file that looks like it decides.
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
