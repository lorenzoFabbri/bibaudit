# Where every file in this directory came from.
#
# One [[fixture]] table per file. The build fails if the two sets differ in
# either direction — a file nobody wrote an entry for, or an entry naming a
# file that is not here — because omission is the failure this file exists to
# catch, and a check you can satisfy by leaving something out is not one.
#
#
# WHAT AN ENTRY ESTABLISHES, AND WHAT IT DOES NOT
#
# An entry is a claim by whoever added it. The offline suite checks only that
# the claim is coherent: that the file is the kind of response `source` names,
# that the identifier written here is the identifier inside the file, and that
# `url` is the request bibaudit's own registry client would issue for it. A
# fabricated file satisfies all three. A MEDLINE record invented around a real
# PMID passes every offline check there is.
#
# What settles it is `uv run pytest -m network`, which re-fetches every `url`
# and compares the answer with the file on disk. That is the only thing in
# this repository able to tell a recorded registry response from a written
# one. It is opt-in and it is nobody's default, so a fixture you did not fetch
# yourself is unverified until you run it.
#
# A `source = "none"` entry establishes less still: that somebody looked at
# the file and said what it is. Nothing checks the identifiers inside one.
# Those files are bibliographies the tool *reads*, and some of what they carry
# is wrong on purpose.
#
#
# FIELDS
#
# file       basename in this directory.
# source     "pubmed", "crossref", "datacite", "retraction-watch" — or "none"
#            for a bibliography the tool reads rather than a registry answer.
#            A "none" entry carries `note` in place of the fetch fields, and
#            its file must not look like a registry response.
# id         the PMID or DOI the response was requested under.
# url        the exact GET that returns it, in the form built by the client in
#            src/bibaudit/registries/. Checked against that code, so a URL
#            pointing anywhere else fails.
# fetched    the date these bytes were last confirmed to be what `url`
#            answers: the fetch that produced them, or a later re-check that
#            found them unchanged.
# holds      "response" (the default) — the file is the whole response body.
#            "work" — the file is the `message` object out of it, which is
#            what Crossref's batch route yields per item and what `by_dois`
#            hands on.
# synthetic  Retraction Watch only: the `Record ID`s this project wrote. Every
#            other row must be in the live export verbatim, and these must not
#            appear in it at all.
# note       prose, required wherever there is no `url` to settle the matter,
#            so a file nothing re-fetches is still accounted for in writing.
#            One demand is made of the prose: where the file is a JSON list of
#            objects, the note must name every `id` or `key` in it. Nothing
#            else reads a note, and both Zotero notes said "two items" over a
#            file of four for as long as they had existed.
#
# Any other key is a typo, and a typo in a manifest reads as a requirement
# met rather than as an error, so an unknown key fails the build.
#
# There is no field for "part of a response". A fixture is the whole of what
# the registry sent or it is not a fixture, and a value dropped quietly is
# indistinguishable from a value invented. The Retraction Watch export is the
# one exception the format admits, because it is 71,641 rows, and it pays for
# the exception by naming every row it did not copy.


